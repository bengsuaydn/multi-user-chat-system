
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Server Monitoring</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .status {
            margin-bottom: 25px;
            color: #fbbf24;
        }

        .status.connected {
            color: #4ade80;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: #1f2937;
            padding: 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 200px;
        }

        .card h3 {
            color: #9ca3af;
            margin-top: 0;
            font-size: 15px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .events {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
        }

        .events h2 {
            margin-top: 0;
        }

        #eventList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #eventList li {
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: #374151;
            border-left: 4px solid #9ca3af;
            overflow-wrap: anywhere;
        }

        .connect {
            border-left-color: #4ade80 !important;
        }

        .disconnect {
            border-left-color: #f87171 !important;
        }

        .public {
            border-left-color: #60a5fa !important;
        }

        .private {
            border-left-color: #c084fc !important;
        }

        .rate-limit {
            border-left-color: #fbbf24 !important;
        }

        .error {
            border-left-color: #ef4444 !important;
        }

        .event-time {
            color: #9ca3af;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <h1>Chat Server Monitoring</h1>
    <p class="subtitle">Live server activity and statistics</p>

    <div id="connectionStatus" class="status">
        Connecting to Monitoring Server...
    </div>

    <div class="cards">

        <div class="card">
            <h3>Connected Users</h3>
            <div class="number" id="userCount">0</div>
        </div>

        <div class="card">
            <h3>Processed Messages</h3>
            <div class="number" id="messageCount">0</div>
        </div>

    </div>

    <div class="events">
        <h2>Live Events</h2>
        <ul id="eventList"></ul>
    </div>

    <script>
        const socket = new WebSocket("ws://localhost:8765");

        const statusElement = document.getElementById("connectionStatus");
        const userCountElement = document.getElementById("userCount");
        const messageCountElement = document.getElementById("messageCount");
        const eventList = document.getElementById("eventList");

        socket.onopen = function () {
            statusElement.textContent = "Connected to Monitoring Server";
            statusElement.className = "status connected";

            socket.send("DASHBOARD");
        };

        socket.onmessage = function (event) {
            const message = event.data;

            // Update dashboard counters
            if (message.startsWith("COUNTS")) {
                const usersMatch = message.match(/Users:\s*(\d+)/);
                const messagesMatch = message.match(/Messages:\s*(\d+)/);

                if (usersMatch) {
                    userCountElement.textContent = usersMatch[1];
                }

                if (messagesMatch) {
                    messageCountElement.textContent = messagesMatch[1];
                }

                return;
            }

            // Determine event type
            let eventClass = "error";

            if (message.startsWith("CONNECT")) {
                eventClass = "connect";
            }
            else if (message.startsWith("DISCONNECT")) {
                eventClass = "disconnect";
            }
            else if (message.startsWith("PUBLIC")) {
                eventClass = "public";
            }
            else if (message.startsWith("PRIVATE")) {
                eventClass = "private";
            }
            else if (message.startsWith("RATE_LIMIT")) {
                eventClass = "rate-limit";
            }
            else if (
                message.startsWith("ERROR") ||
                message.startsWith("SOCKET ERROR")
            ) {
                eventClass = "error";
            }

            // Create event element
            const listItem = document.createElement("li");
            listItem.className = eventClass;

            const time = document.createElement("span");
            time.className = "event-time";
            time.textContent = new Date().toLocaleTimeString();

            const eventText = document.createElement("span");
            eventText.textContent = message;

            listItem.appendChild(time);
            listItem.appendChild(eventText);

            // Show newest event first
            eventList.prepend(listItem);
        };

        socket.onclose = function () {
            statusElement.textContent = "Disconnected from Monitoring Server";
            statusElement.className = "status";
        };

        socket.onerror = function () {
            statusElement.textContent = "Monitoring connection error";
            statusElement.className = "status";
        };
    </script>

</body>
</html>
